
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 Halloweenkartan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;}
header{background:#ff6b00;color:#fff;text-align:center;padding:20px;}
.actions{background:#222;text-align:center;padding:15px;}
.button{display:inline-block;background:#ff6b00;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold;}
#map{height:calc(100vh - 170px);}
</style>
</head>
<body>
<header>
<h1>🎃 Halloweenkartan</h1>
<p>Här hittar du hus som delar ut godis</p>
</header>
<div class="actions">
<a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLSen2r3bKVxuKPJHI8f-RmndOOjGY8eyBCqyq28hIDfyqAuOoQ/viewform" target="_blank">🏠 Anmäl ditt hus</a>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
 const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGSZAt6uhmSbTMvcybZl8837LH1K7sEAs6puDo-GCvA3cPcLtAj50PGfwPlNSNItCDULt_gWzJW-z6/pub?gid=417364393&single=true&output=csv';
// Kolumnnummer (börjar på 0)
const COL = { adress: 1, tid: 3, kommentar: 4, lat: 5, lng: 6 };

const map = L.map('map').setView([59.31, 18.06], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

const num = v => parseFloat(String(v).replace(',', '.'));

fetch(CSV_URL)
  .then(r => r.text())
  .then(text => {
    const rows = parseCSV(text).slice(1);
    const bounds = [];
    rows.forEach(r => {
      const lat = num(r[COL.lat]), lng = num(r[COL.lng]);
      if (isNaN(lat) || isNaN(lng)) return;
      const div = document.createElement('div');
      const b = document.createElement('b');
      b.textContent = r[COL.adress] || '';
      div.appendChild(b);
      [r[COL.tid] && 'Välkomna: ' + r[COL.tid], r[COL.kommentar]]
        .filter(Boolean)
        .forEach(t => {
          div.appendChild(document.createElement('br'));
          div.appendChild(document.createTextNode(t));
        });
      L.marker([lat, lng]).addTo(map).bindPopup(div);
      bounds.push([lat, lng]);
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
  })
  .catch(err => console.error('Kunde inte hämta data:', err));
 
</script>
</body>
</html>
