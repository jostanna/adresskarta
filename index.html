<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 Halloweenkartan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;}
header{background:#ff6b00;color:#fff;text-align:center;padding:20px;}
.actions{background:#222;text-align:center;padding:15px;}
.button{display:inline-block;background:#ff6b00;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold;}
#map{height:calc(100vh - 170px);}
</style>
</head>
<body>
<header>
<h1>🎃 Halloweenkartan</h1>
<p>Här hittar du hus som delar ut godis</p>
</header>
<div class="actions">
<a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLSen2r3bKVxuKPJHI8f-RmndOOjGY8eyBCqyq28hIDfyqAuOoQ/viewform" target="_blank">🏠 Anmäl ditt hus</a>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([59.43,18.07],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'© OpenStreetMap'
}).addTo(map);
L.marker([59.43,18.07]).addTo(map).bindPopup('Testmarkör');
</script>
</body>
</html>
